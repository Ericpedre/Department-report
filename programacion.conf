# programacion.conf — cuando corre el buscador. Lo lee systemd/condicion.sh
# antes de cada disparo del timer (ExecCondition de apartamentos.service).
# Se edita aca; no hace falta daemon-reload, se lee en cada disparo.

# Pausa: hasta esta fecha (inclusive) NO se hace ninguna request a Encuentra24.
# Puesta el 2026-10-01 tras 9 dias de bloqueo de Cloudflare, para dejar de
# golpear el sitio y darle tiempo a que levante el desafio. Vacio = sin pausa.
# Vale para las DOS busquedas: la diaria de alquiler y la semanal de venta.
PAUSA_HASTA=2026-10-15

# Cada cuantos dias corre como minimo. 1 = diario, 2 = dia por medio.
# Se cuenta desde la ultima corrida REAL (no desde la fecha del calendario),
# asi el ritmo no se descuadra a fin de mes ni si la Pi estuvo apagada.
INTERVALO_DIAS=2

# Crawl de venta (venta.timer, domingos). El timer ya es semanal; esto sirve
# para espaciarlo mas sin tocar systemd: 14 = cada dos semanas.
# Ojo: usar 13 y no 14 si la Pi pudo estar apagada y el domingo se recupero el
# lunes, o se saltea una semana extra. 1 = sin restriccion extra.
INTERVALO_VENTA_DIAS=1
